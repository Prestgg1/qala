name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: qala
          POSTGRES_PASSWORD: qala
          POSTGRES_DB: qala_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qala" --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx tsc -p tsconfig.json --noEmit
      - run: bun test packages
